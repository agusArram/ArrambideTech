<header class="hd" [class.is-solid]="solid() && !open()" [class.is-open]="open()">
  <div class="hd__bar im-wrap">
    <a routerLink="/" class="hd__brand" aria-label="Arrambide Tech, inicio" (dblclick)="logoEgg($event)">
      Arrambide<span>Tech</span><i class="hd__dot" aria-hidden="true" (click)="dotEgg($event)"></i>
    </a>

    <nav class="hd__nav" aria-label="Principal">
      @for (l of links; track l.path) {
        <a [routerLink]="l.path" routerLinkActive="is-active" class="hd__link">{{ l.label }}</a>
      }
    </nav>

    <a routerLink="/contacto" class="hd__cta">Agendar conversación</a>

    <button
      type="button"
      class="hd__burger"
      [class.is-open]="open()"
      (click)="toggle()"
      [attr.aria-expanded]="open()"
      aria-controls="hd-mobile"
      [attr.aria-label]="open() ? 'Cerrar menú' : 'Abrir menú'"
    >
      <span></span><span></span>
    </button>
  </div>
</header>

<!-- Menú móvil: capa propia a pantalla completa; tocar fuera de los enlaces lo cierra -->
<div id="hd-mobile" class="ov" [class.is-open]="open()" (click)="setOpen(false)">
  <nav class="ov__nav im-wrap" aria-label="Móvil" [attr.aria-hidden]="!open()">
    @for (l of links; track l.path; let i = $index) {
      <a [routerLink]="l.path" routerLinkActive="is-active" [style.--i]="i" [attr.tabindex]="open() ? 0 : -1" (click)="$event.stopPropagation(); setOpen(false)">{{ l.label }}</a>
    }
    <a routerLink="/contacto" class="ov__cta" [style.--i]="2" [attr.tabindex]="open() ? 0 : -1" (click)="$event.stopPropagation(); setOpen(false)">Agendar conversación</a>
  </nav>
  <p class="ov__hint">Tocá fuera para cerrar</p>
</div>
