<header class="hd" [class.is-solid]="solid() || open()">
  <div class="hd__bar im-wrap">
    <a routerLink="/" class="hd__brand" aria-label="Arrambide Tech, inicio">
      Arrambide<span>Tech</span><i class="hd__dot" aria-hidden="true"></i>
    </a>

    <nav class="hd__nav" aria-label="Principal">
      @for (l of links; track l.path) {
        <a [routerLink]="l.path" routerLinkActive="is-active" class="hd__link">{{ l.label }}</a>
      }
      <a routerLink="/" fragment="demo" class="hd__link">Demo</a>
    </nav>

    <a routerLink="/contacto" class="hd__cta">Agendar conversación</a>

    <button
      type="button"
      class="hd__burger"
      [class.is-open]="open()"
      (click)="toggle()"
      [attr.aria-expanded]="open()"
      aria-controls="hd-mobile"
      aria-label="Abrir menú"
    >
      <span></span><span></span>
    </button>
  </div>

  <div id="hd-mobile" class="hd__mobile" [class.is-open]="open()">
    <nav class="im-wrap" aria-label="Móvil">
      @for (l of links; track l.path) {
        <a [routerLink]="l.path" routerLinkActive="is-active">{{ l.label }}</a>
      }
      <a routerLink="/" fragment="demo">Demo</a>
      <a routerLink="/contacto" class="hd__mcta">Agendar conversación</a>
    </nav>
  </div>
</header>
