<section id="pruebas" class="proof" aria-labelledby="proof-title">
  <div class="proof__inner">
    <header appReveal>
      <p class="eyebrow"><span class="eyebrow__n">02</span> Resultados</p>
      <h2 id="proof-title" class="title">Problemas reales<br />que ya resolvimos.</h2>
    </header>

    <ul class="grid">
      @for (r of results; track r.title; let i = $index) {
        <li class="item" [appReveal]="i * 90">
          <span class="item__v">{{ r.value }}</span>
          <span class="item__t">{{ r.title }}</span>
          <span class="item__l">{{ r.line }}</span>
        </li>
      }
    </ul>

    <p class="proof__more" appReveal>
      <a routerLink="/soluciones" fragment="acceso">Ver el caso completo →</a>
    </p>
  </div>
</section>
