<app-header></app-header>

<main class="im-page ct">
  <div class="ct__spacer" aria-hidden="true"></div>
  <app-contact-form></app-contact-form>

  <section class="im-section">
    <div class="im-wrap ct__faq">
      <div>
        <p class="im-eyebrow">Preguntas frecuentes</p>
        <h2 class="im-title">Antes de escribir.</h2>
      </div>
      <div class="ct__list">
        @for (f of faqs; track f.q) {
          <details>
            <summary>{{ f.q }}</summary>
            <p>{{ f.a }}</p>
          </details>
        }
      </div>
    </div>
  </section>
</main>

<app-footer></app-footer>
