<app-header></app-header>

<main>
  <app-story></app-story>
  <app-face-demo></app-face-demo>
  <app-proof></app-proof>

  <section class="teaser im-section" aria-labelledby="teaser-title">
    <div class="im-wrap">
      <p class="im-eyebrow"><b>03</b> Casos</p>
      <h2 id="teaser-title" class="im-title">Tres sistemas, tres entornos reales.</h2>

      <div class="teaser__grid">
        @for (c of cases; track c.id) {
          <a class="card" routerLink="/soluciones" [fragment]="c.id">
            <span class="card__verb">{{ c.verb }}</span>
            <h3>{{ c.title }}</h3>
            <p>{{ c.text }}</p>
            <span class="card__more">Ver el caso →</span>
          </a>
        }
      </div>
    </div>
  </section>

  <app-contact-form></app-contact-form>
</main>

<app-footer></app-footer>
