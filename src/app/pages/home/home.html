<app-header></app-header>

<main>
  <app-story></app-story>
  <app-face-demo></app-face-demo>
  <app-proof></app-proof>

  <section class="teaser im-section" aria-labelledby="teaser-title">
    <div class="im-wrap">
      <div appReveal>
        <p class="im-eyebrow"><b>03</b> Casos</p>
        <h2 id="teaser-title" class="im-title">Tres sistemas, tres entornos reales.</h2>
      </div>

      <div class="teaser__grid">
        @for (c of cases; track c.id; let i = $index) {
          <a class="card" routerLink="/soluciones" [fragment]="c.id" [appReveal]="i * 90">
            <span class="card__verb">{{ c.verb }}</span>
            <h3>{{ c.title }}</h3>
            <p>{{ c.text }}</p>
            <p class="card__where">{{ c.where }}</p>
            <p class="card__metric"><b>{{ c.value }}</b><span>{{ c.unit }}</span></p>
            <span class="card__more">Ver el caso →</span>
          </a>
        }
      </div>
    </div>
  </section>

  <app-contact-form></app-contact-form>
</main>

<app-footer></app-footer>
